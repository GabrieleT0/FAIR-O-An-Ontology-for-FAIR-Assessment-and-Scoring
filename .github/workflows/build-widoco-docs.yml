name: Build WIDOCO documentation

on:
  push:
    branches:
      - main
    paths:
      - "FAIR-O.ttl"
      - "widoco-sections/**"
      - ".github/workflows/build-widoco-docs.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    env:
      ONTOLOGY_VERSION: "1.0.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare temporary workspace
        run: |
          sudo rm -rf /tmp/widoco-input /tmp/widoco-output
          mkdir -p /tmp/widoco-input
          mkdir -p /tmp/widoco-output
          mkdir -p /tmp/widoco-output/resources
          mkdir -p /tmp/widoco-output/webvowl
          cp FAIR-O.ttl /tmp/widoco-input/FAIR-O.ttl
          chmod -R 777 /tmp/widoco-output

      - name: Generate WIDOCO documentation with OOPS
        run: |
          docker run --rm \
            -v /tmp/widoco-input:/input \
            -v /tmp/widoco-output:/output \
            ghcr.io/dgarijo/widoco:latest \
            -ontFile /input/FAIR-O.ttl \
            -outFolder /output \
            -webVowl \
            -rewriteAll \
            -getOntologyMetadata \
            -oops

      - name: Fix WIDOCO output permissions
        run: |
          sudo chown -R "$(id -u):$(id -g)" /tmp/widoco-output
          chmod -R u+rwX /tmp/widoco-output

      - name: Add context to JSON-LD
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("/tmp/widoco-output/ontology.jsonld")
          graph = json.loads(path.read_text(encoding="utf-8"))
          document = {
              "@context": {
                  "fairo": "https://w3id.org/fair-o#",
                  "dcterms": "http://purl.org/dc/terms/",
                  "owl": "http://www.w3.org/2002/07/owl#",
                  "prov": "http://www.w3.org/ns/prov#",
                  "rdf": "http://www.w3.org/1999/02/22-rdf-syntax-ns#",
                  "rdfs": "http://www.w3.org/2000/01/rdf-schema#",
                  "skos": "http://www.w3.org/2004/02/skos/core#",
                  "xsd": "http://www.w3.org/2001/XMLSchema#"
              },
              "@graph": graph
          }
          path.write_text(json.dumps(document, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Replace docs folder
        run: |
          sudo rm -rf docs
          mkdir -p docs
          cp -R /tmp/widoco-output/. docs/

          if [ -f docs/index-en.html ]; then
            cp docs/index-en.html docs/index.html
          fi

          # Publish a versioned copy for the owl:versionIRI.
          mkdir -p "docs/${ONTOLOGY_VERSION}"
          cp -R /tmp/widoco-output/. "docs/${ONTOLOGY_VERSION}/"

          if [ -f "docs/${ONTOLOGY_VERSION}/index-en.html" ]; then
            cp "docs/${ONTOLOGY_VERSION}/index-en.html" \
              "docs/${ONTOLOGY_VERSION}/index.html"
          fi

      - name: Replace WIDOCO placeholder sections
        run: |
          for output_dir in docs "docs/${ONTOLOGY_VERSION}"; do
            mkdir -p "${output_dir}/sections"

            if [ -f widoco-sections/abstract-en.html ]; then
              cp widoco-sections/abstract-en.html \
                "${output_dir}/sections/abstract-en.html"
            fi

            if [ -f widoco-sections/introduction-en.html ]; then
              cp widoco-sections/introduction-en.html \
                "${output_dir}/sections/introduction-en.html"
            fi

            if [ -f widoco-sections/description-en.html ]; then
              cp widoco-sections/description-en.html \
                "${output_dir}/sections/description-en.html"
            fi
          done

      - name: Constrain generated documentation images
        run: |
          for output_dir in docs "docs/${ONTOLOGY_VERSION}"; do
            {
              printf '\n'
              printf '#description img {\n'
              printf '    display: block;\n'
              printf '    width: 100%%;\n'
              printf '    max-width: 900px;\n'
              printf '    height: auto;\n'
              printf '    margin: 1.5rem auto;\n'
              printf '}\n'
            } >> "${output_dir}/resources/extra.css"
          done

      - name: Commit generated documentation
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update WIDOCO documentation"
          file_pattern: "docs/**"
