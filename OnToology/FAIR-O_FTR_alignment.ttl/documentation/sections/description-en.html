<h2 id="desc" class="list">FAIR-O to FTR Alignment Module: Description <span class="backlink"> back to <a href="#toc">ToC</a></span></h2>

<span class="markdown">This module provides machine-readable mappings between FAIR-O and FTR without changing the FAIR-O core ontology. Since several concepts are related but not logically equivalent, skos:closeMatch is used instead of owl:equivalentClass.</span>
